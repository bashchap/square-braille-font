<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>PUA 4x4 v0.5 Candidate 4</family>
    <prefer>
      <family>Square Braille Unicode Text Seamless</family>
      <family>PUA 4x4 Part 0 v0.5 Candidate 4</family>
      <family>PUA 4x4 Part 1 v0.5 Candidate 4</family>
    </prefer>
  </alias>
  <match target="font">
    <test name="family" compare="contains"><string>PUA 4x4 Part 0 v0.5 Candidate 4</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>PUA 4x4 Part 1 v0.5 Candidate 4</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>
