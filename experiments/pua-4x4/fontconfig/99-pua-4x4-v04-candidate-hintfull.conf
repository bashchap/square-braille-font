<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Diagnostic only: same candidate binaries, forced FreeType autohinting. -->
  <alias binding="strong">
    <family>PUA 4x4 v0.4 Candidate Hintfull</family>
    <prefer>
      <family>Square Braille Unicode Text Seamless</family>
      <family>PUA 4x4 Part 0 v0.4 Candidate</family>
      <family>PUA 4x4 Part 1 v0.4 Candidate</family>
    </prefer>
  </alias>
  <match target="font">
    <test name="family" compare="contains">
      <string>PUA 4x4 Part 0 v0.4 Candidate</string>
    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains">
      <string>PUA 4x4 Part 1 v0.4 Candidate</string>
    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>
