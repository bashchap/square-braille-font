<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- A normal text face is primary; the two graphics faces are an ordered,
       non-overlapping fallback pair for the supplementary-PUA ranges. -->
  <alias binding="strong">
    <family>PUA 4x4</family>
    <prefer>
      <family>Square Braille Unicode Text Seamless</family>
      <family>PUA 4x4 Part 0</family>
      <family>PUA 4x4 Part 1</family>
    </prefer>
  </alias>
</fontconfig>
